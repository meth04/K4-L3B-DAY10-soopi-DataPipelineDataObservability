name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run test suite
        run: uv run pytest tests -q

      - name: Run baseline pipeline (offline snapshot)
        env:
          LLM_PROVIDER: mock
          REFRESH_SOURCE: "0"
          REFRESH_TEST_SET: "0"
        run: uv run python script/run_phase1.py

      - name: Run corruption + repair flow
        env:
          LLM_PROVIDER: mock
          REFRESH_SOURCE: "0"
          REFRESH_TEST_SET: "0"
        run: uv run python script/run_corruption_flow.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-artifacts
          path: |
            data/results/*.json
            data/reports/*.md
            data/quality/*.json
          if-no-files-found: warn
